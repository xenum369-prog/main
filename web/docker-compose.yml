services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maintenance
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in web/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maintenance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: postgresql://maintenance:${POSTGRES_PASSWORD}@db:5432/maintenance?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      NODE_ENV: production
      STORAGE_DIR: /var/lib/maintenance/files
      DATABASE_URL: postgresql://maintenance:${POSTGRES_PASSWORD}@db:5432/maintenance?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - maintenance_files:/var/lib/maintenance/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  maintenance_postgres:
  maintenance_files:
