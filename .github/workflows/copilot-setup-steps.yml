name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - web/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - web/**

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maintenance
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d maintenance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: web

    env:
      DATABASE_URL: postgresql://copilot:copilot@127.0.0.1:5432/maintenance
      SESSION_SECRET: ci-only-session-secret-not-for-deployments-1234567890
      STORAGE_DIR: ${{ runner.temp }}/maintenance-files

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate configured environment
        run: npm run env:check

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Discover critical browser journey
        run: npm run test:e2e -- --list

      - name: Production build
        run: npm run build

